name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run portable
      - name: Portable smoke test
        shell: cmd
        run: |
          out\NoteScript-portable\NoteScript.cmd capabilities
          copy /Y "test\fixtures\basic-project.md" "out\NoteScript-portable\projects\Test Fixture.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Test Fixture.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\SFZ Basic.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\BeatLane6 Starter.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Sunlit Detour.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Morning Window.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Rain on the Balcony.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Slow Train Home.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Cafe After Rain.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Cloud Pillow.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\River Lanterns.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Sunday Pages.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Quiet Neon.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Garden at Four.md"
          out\NoteScript-portable\NoteScript.cmd validate "out\NoteScript-portable\projects\Moonlit Tea.md"
          out\NoteScript-portable\NoteScript.cmd list-sounds "out\NoteScript-portable\projects\Test Fixture.md"
          out\NoteScript-portable\NoteScript.cmd list-instruments "out\NoteScript-portable\projects\SFZ Basic.md"
          out\NoteScript-portable\NoteScript.cmd render "out\NoteScript-portable\projects\Test Fixture.md" -o "out\NoteScript-portable\exports\Test Fixture.wav"
          out\NoteScript-portable\NoteScript.cmd render "out\NoteScript-portable\projects\SFZ Basic.md" -o "out\NoteScript-portable\exports\SFZ Basic.wav"
      - name: Portable Studio and Control API smoke test
        shell: pwsh
        run: |
          $root = (Resolve-Path "out\NoteScript-portable").Path
          $entry = Join-Path $root "NoteScript.cmd"
          if (-not (Test-Path $entry)) {
            throw "NoteScript.cmd is missing from the portable build."
          }

          Copy-Item -LiteralPath "test\fixtures\basic-project.md" -Destination (Join-Path $root "projects\Test Fixture.md") -Force

          foreach ($legacy in @(
            "Start-Control-API.cmd",
            "Stop-Control-API.cmd",
            "NoteScript-Studio.cmd",
            "Audition-Keyboard.cmd",
            "Preview-Song.cmd",
            "Render-Song.cmd"
          )) {
            if (Test-Path (Join-Path $root $legacy)) {
              throw "Legacy duplicate launcher should not exist: $legacy"
            }
          }

          foreach ($wrapper in @(
            "Studio.bat",
            "Start.bat",
            "Stop.bat",
            "Status.bat",
            "Validate.bat",
            "Render.bat"
          )) {
            $wrapperFile = Join-Path $root $wrapper
            if (-not (Test-Path $wrapperFile)) {
              throw "Missing convenience wrapper: $wrapper"
            }
            $wrapperText = Get-Content -Raw -LiteralPath $wrapperFile
            if ($wrapperText -notmatch 'NoteScript\.cmd') {
              throw "Wrapper does not delegate to NoteScript.cmd: $wrapper"
            }
          }

          $env:NOTESCRIPT_ROOT = $root
          $network = Get-Content -Raw -LiteralPath (Join-Path $root "config\network.json") | ConvertFrom-Json
          $requestHost = [string]$network.host
          if ($requestHost -eq "0.0.0.0") { $requestHost = "127.0.0.1" }
          if ($requestHost -eq "::") { $requestHost = "::1" }
          if ($requestHost.Contains(":") -and -not $requestHost.StartsWith("[")) {
            $requestHost = "[" + $requestHost + "]"
          }
          $baseUri = "http://" + $requestHost + ":" + [string]$network.port

          $statusStopped = (& $entry status | Out-String)
          if ($LASTEXITCODE -ne 0 -or $statusStopped -notmatch 'State\s*:\s*STOPPED' -or $statusStopped -notmatch [regex]::Escape($baseUri + "/")) {
            throw "NoteScript.cmd status did not report the expected STOPPED state."
          }

          & $entry start
          if ($LASTEXITCODE -ne 0) {
            throw "NoteScript.cmd start failed."
          }

          try {
            $ready = $false
            for ($i = 0; $i -lt 24; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "$baseUri/v1/health" -TimeoutSec 2
                if ($health.ok) {
                  $ready = $true
                  break
                }
              } catch {
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              throw "Portable Control API did not become ready."
            }

            $statusRunning = (& $entry status | Out-String)
            if (
              $LASTEXITCODE -ne 0 -or
              $statusRunning -notmatch 'State\s*:\s*RUNNING' -or
              $statusRunning -notmatch 'PID\s*:\s*\d+' -or
              $statusRunning -notmatch 'Health\s*:\s*OK'
            ) {
              throw "NoteScript.cmd status did not report a healthy RUNNING state."
            }

            $statusWrapper = (& (Join-Path $root "Status.bat") | Out-String)
            if ($LASTEXITCODE -ne 0 -or $statusWrapper -notmatch 'State\s*:\s*RUNNING') {
              throw "Status.bat did not delegate to NoteScript.cmd status."
            }

            $page = Invoke-WebRequest -UseBasicParsing -Uri "$baseUri/" -TimeoutSec 5
            $appScript = Invoke-WebRequest -UseBasicParsing -Uri "$baseUri/ui/app.js" -TimeoutSec 5
            $keyboardScript = Invoke-WebRequest -UseBasicParsing -Uri "$baseUri/ui/keyboard.js" -TimeoutSec 5

            if (
              $appScript.StatusCode -ne 200 -or
              $keyboardScript.StatusCode -ne 200 -or
              $appScript.Content -notmatch 'isTextEntryTarget\(event\.target\)' -or
              $appScript.Content -notmatch 'function isPlayTabActive\(\)' -or
              $appScript.Content -notmatch 'const leavingPlay = isPlayTabActive\(\) && name !== "play"' -or
              $appScript.Content -notmatch 'if \(!isPlayTabActive\(\)\) return' -or
              $appScript.Content -match 'event\.target instanceof HTMLSelectElement' -or
              $appScript.Content -match 'event\.target instanceof HTMLButtonElement' -or
              $keyboardScript.Content -notmatch 'physicalBindingFromCode' -or
              $keyboardScript.Content -notmatch '\^Key\[A-Z\]\$' -or
              $keyboardScript.Content -notmatch 'bindingCandidatesFromEvent'
            ) {
              throw "Portable global/physical hotkey smoke test failed."
            }

            if (
              $page.StatusCode -ne 200 -or
              $page.Content -notmatch "NOTESCRIPT STUDIO" -or
              $page.Content -notmatch 'data-tab="play"' -or
              $page.Content -notmatch 'id="advancedPlay"' -or
              $page.Content -notmatch 'id="nodeInspectorApply"' -or
              $page.Content -notmatch 'id="pianoHotkeyEdit"' -or
              $page.Content -notmatch 'id="pianoHotkeySave"' -or
              $page.Content -notmatch 'id="pianoHotkeyCancel"' -or
              $page.Content -notmatch 'id="soundPadHotkeyEdit"' -or
              $page.Content -notmatch 'id="soundPadHotkeySave"' -or
              $page.Content -notmatch 'id="soundPadHotkeyCancel"' -or
              $page.Content -notmatch 'id="soundPadMixLock"' -or
              $page.Content -notmatch 'id="soundPadResetMix"' -or
              $page.Content -notmatch 'id="playSourceType"' -or
              $page.Content -notmatch 'value="soundpiano">SoundPiano' -or
              $page.Content -notmatch 'value="soundpad">SoundPad' -or
              $page.Content -notmatch 'value="gamebeatlane6">GameBeatLane6' -or
              $page.Content -notmatch 'id="transportVoiceSelect"' -or
              $page.Content -match 'id="transportLoad"' -or
              $page.Content -notmatch 'id="composeFileInput"' -or
              $page.Content -notmatch 'id="composePreviewPlay"[^>]*>Play' -or
              $page.Content -notmatch 'id="composePreviewPause"[^>]*>Pause' -or
              $page.Content -notmatch 'id="composePreviewStop"[^>]*>Stop' -or
              $page.Content -notmatch 'id="composePreviewStatus"' -or
              $page.Content -notmatch 'data-compose-mode="tracks"' -or
              $page.Content -notmatch 'data-compose-view="tracks"' -or
              $page.Content -match 'data-tab="tracks"' -or
              $page.Content -match 'id="composeTrackSelect"' -or
              $page.Content -match 'id="composeApplyVoice"' -or
              $page.Content -match 'id="tracksFileInput"' -or
              $page.Content -match 'id="advancedReload"' -or
              $page.Content -notmatch 'id="tracksAddTrack"' -or
              $page.Content -notmatch 'id="tracksDownloadMd"' -or
              $page.Content -notmatch 'id="tracksOutputName"' -or
              $page.Content -match 'id="tracksSaveProject"' -or
              $page.Content -notmatch 'id="tracksDownloadMix"' -or
              $page.Content -notmatch 'id="tracksDownloadSet"' -or
              $page.Content -match 'id="workspaceModeSetting"' -or
              $page.Content -notmatch 'id="renderOutputName"' -or
              $page.Content -notmatch 'id="renderProject"[^>]*>Download WAV' -or
              $page.Content -notmatch 'id="beatLaneView"' -or
              $page.Content -notmatch 'id="beatLaneHighway"' -or
              $page.Content -notmatch 'id="beatLaneProject"' -or
              $page.Content -notmatch 'id="beatLaneStart"' -or
              $page.Content -notmatch 'id="beatLaneResult"' -or
              $page.Content -notmatch 'id="transportPan"' -or
              $page.Content -notmatch 'class="pan-scale"'
            ) {
              throw "Portable Studio HTML smoke test failed."
            }

            $project = Invoke-RestMethod -Uri "$baseUri/v1/project?project=Test%20Fixture.md" -TimeoutSec 5
            if (-not $project.valid -or $project.song.tracks.Count -ne 2) {
              throw "Portable project API smoke test failed."
            }

            $beatLane = Invoke-RestMethod -Uri "$baseUri/v1/game/beatlane6/chart?project=BeatLane6%20Starter.md&difficulty=normal" -TimeoutSec 5
            $beatLaneUsed = @($beatLane.events | ForEach-Object { [int]$_.lane } | Sort-Object -Unique)
            if (
              $beatLane.game -ne "BeatLane6" -or
              $beatLane.laneCount -ne 6 -or
              $beatLane.events.Count -lt 20 -or
              $beatLane.stats.holdCount -lt 1 -or
              $beatLane.lanes.Count -ne 6 -or
              $beatLane.lanes[0].key -ne "a" -or
              $beatLane.lanes[5].key -ne "l" -or
              $beatLaneUsed.Count -ne 6
            ) {
              throw "Portable BeatLane6 starter chart API smoke test failed."
            }

            foreach ($songName in @(
              "Sunlit Detour.md"
            )) {
              $songPath = Join-Path $root ("projects\" + $songName)
              if (-not (Test-Path $songPath)) {
                throw "Missing portable BeatLane6 song-pack project: $songName"
              }

              $encodedSong = [uri]::EscapeDataString($songName)
              $songChart = Invoke-RestMethod -Uri "$baseUri/v1/game/beatlane6/chart?project=$encodedSong&difficulty=normal" -TimeoutSec 5
              $songLanes = @($songChart.events | ForEach-Object { [int]$_.lane } | Sort-Object -Unique)
              if (
                $songChart.game -ne "BeatLane6" -or
                $songChart.laneCount -ne 6 -or
                [double]$songChart.durationSeconds -lt 60 -or
                $songChart.events.Count -lt 300 -or
                $songChart.events.Count -gt 650 -or
                $songChart.stats.tapCount -lt 1 -or
                $songChart.stats.holdCount -lt 1 -or
                $songLanes.Count -ne 6
              ) {
                throw "Portable BeatLane6 long-form song-pack chart smoke test failed: $songName"
              }
            }

            $capabilities = Invoke-RestMethod -Uri "$baseUri/v1/capabilities" -TimeoutSec 5
            if (
              -not $capabilities.games.beatLane6.available -or
              $capabilities.games.beatLane6.lanes -ne 6
            ) {
              throw "Portable BeatLane6 capability smoke test failed."
            }

            $settings = Invoke-RestMethod -Uri "$baseUri/v1/studio/settings" -TimeoutSec 5
            if (
              ($settings.PSObject.Properties.Name -contains "workspaceMode") -or
              $settings.editorMode -ne "text" -or
              [int]$settings.version -lt 4 -or
              $null -eq $settings.soundPadMixLocks
            ) {
              throw "Portable Studio settings smoke test failed."
            }

            $expectedSoundPiano = Join-Path $root "sounds\soundpiano\piano\pack.md"
            $expectedSoundPad = Join-Path $root "sounds\soundpad\soundpad\pack.md"
            $legacyFlatPiano = Join-Path $root "sounds\piano\pack.md"
            $legacyFlatSoundPad = Join-Path $root "sounds\soundpad\pack.md"
            if (
              -not (Test-Path $expectedSoundPiano) -or
              -not (Test-Path $expectedSoundPad) -or
              (Test-Path $legacyFlatPiano) -or
              (Test-Path $legacyFlatSoundPad)
            ) {
              throw "Portable sound category folder layout smoke test failed."
            }

            $sounds = Invoke-RestMethod -Uri "$baseUri/v1/sounds?details=1" -TimeoutSec 5
            $requiredSoundIds = @(
              "piano",
              "electric-piano",
              "music-box",
              "organ",
              "synth-bass",
              "synth-lead",
              "warm-pad",
              "pluck",
              "acoustic-guitar",
              "nylon-guitar",
              "clean-electric-guitar",
              "jazz-guitar",
              "strings",
              "flute",
              "marimba",
              "vibraphone",
              "choir",
              "soft-brass",
              "soundpad",
              "acoustic-drums",
              "brush-drums",
              "electronic-drums",
              "lofi-drums"
            )
            foreach ($requiredSoundId in $requiredSoundIds) {
              if (@($sounds.sounds | Where-Object { $_.id -eq $requiredSoundId }).Count -ne 1) {
                throw "Missing portable production sound: $requiredSoundId"
              }
            }
            $soundPad = @($sounds.sounds | Where-Object { $_.id -eq "soundpad" })
            $acousticDrums = @($sounds.sounds | Where-Object { $_.id -eq "acoustic-drums" })
            $piano = @($sounds.sounds | Where-Object { $_.id -eq "piano" })
            $acousticGuitar = @($sounds.sounds | Where-Object { $_.id -eq "acoustic-guitar" })
            if (
              $sounds.sounds.Count -ne $requiredSoundIds.Count -or
              $soundPad[0].type -ne "soundpad" -or
              $soundPad[0].category -ne "soundpad" -or
              $soundPad[0].triggers.Count -ne 16 -or
              -not ($soundPad[0].triggers -contains "impact") -or
              $acousticDrums[0].type -ne "soundpad" -or
              $acousticDrums[0].category -ne "soundpad" -or
              $acousticDrums[0].triggers.Count -ne 16 -or
              $piano[0].type -ne "pitched" -or
              $piano[0].category -ne "soundpiano" -or
              $acousticGuitar[0].type -ne "pitched" -or
              $acousticGuitar[0].category -ne "soundpiano"
            ) {
              throw "Portable production sound category / SoundPad discovery smoke test failed."
            }

            $preview = Join-Path $env:RUNNER_TEMP "notescript-transport-preview.wav"
            Invoke-WebRequest -UseBasicParsing -Uri "$baseUri/v1/transport/audio?project=Test%20Fixture.md" -OutFile $preview -TimeoutSec 15
            $bytes = [System.IO.File]::ReadAllBytes($preview)
            if ($bytes.Length -le 44 -or [System.Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne "RIFF") {
              throw "Portable transport preview is not a valid WAV."
            }

            $previewOverride = Join-Path $env:RUNNER_TEMP "notescript-transport-electric-piano.wav"
            Invoke-WebRequest -UseBasicParsing -Uri "$baseUri/v1/transport/audio?project=Test%20Fixture.md&sourceType=sound&sourceId=electric-piano" -OutFile $previewOverride -TimeoutSec 15
            $overrideBytes = [System.IO.File]::ReadAllBytes($previewOverride)
            if (
              $overrideBytes.Length -le 44 -or
              [System.Text.Encoding]::ASCII.GetString($overrideBytes, 0, 4) -ne "RIFF" -or
              (Get-FileHash $previewOverride).Hash -eq (Get-FileHash $preview).Hash
            ) {
              throw "Portable transport voice override smoke test failed."
            }

            $previewInstrument = Join-Path $env:RUNNER_TEMP "notescript-transport-sfz.wav"
            Invoke-WebRequest -UseBasicParsing -Uri "$baseUri/v1/transport/audio?project=Test%20Fixture.md&sourceType=instrument&sourceId=SFZ%2Fbasic-sfz" -OutFile $previewInstrument -TimeoutSec 15
            $instrumentBytes = [System.IO.File]::ReadAllBytes($previewInstrument)
            if (
              $instrumentBytes.Length -le 44 -or
              [System.Text.Encoding]::ASCII.GetString($instrumentBytes, 0, 4) -ne "RIFF" -or
              (Get-FileHash $previewInstrument).Hash -eq (Get-FileHash $preview).Hash
            ) {
              throw "Portable transport Instrument override smoke test failed."
            }

            $downloadWav = Join-Path $env:RUNNER_TEMP "notescript-compose-download.wav"
            $composeMarkdown = Get-Content -Raw (Join-Path $root "projects\Test Fixture.md")
            $composeBody = [pscustomobject]@{
              markdown = [string]$composeMarkdown
              fileName = "Compose CI.md"
            } | ConvertTo-Json -Compress
            Invoke-WebRequest -UseBasicParsing -Method Post -ContentType "application/json" -Body $composeBody -Uri "$baseUri/v1/render/audio" -OutFile $downloadWav -TimeoutSec 15
            $downloadBytes = [System.IO.File]::ReadAllBytes($downloadWav)
            if ($downloadBytes.Length -le 44 -or [System.Text.Encoding]::ASCII.GetString($downloadBytes, 0, 4) -ne "RIFF") {
              throw "Portable Compose current-Markdown download WAV endpoint is not a valid WAV."
            }

            $stem0 = Join-Path $env:RUNNER_TEMP "notescript-track-0.wav"
            $stem1 = Join-Path $env:RUNNER_TEMP "notescript-track-1.wav"
            Invoke-WebRequest -UseBasicParsing -Uri "$baseUri/v1/transport/track-audio?project=Test%20Fixture.md&track=0" -OutFile $stem0 -TimeoutSec 15
            Invoke-WebRequest -UseBasicParsing -Uri "$baseUri/v1/transport/track-audio?project=Test%20Fixture.md&track=1" -OutFile $stem1 -TimeoutSec 15

            $tracksUiScript = Get-Content -Raw (Join-Path $root "app\src\control\ui\app.js")
            if (
              $tracksUiScript -notmatch '/v1/tracks/track-audio' -or
              $tracksUiScript -notmatch '/v1/tracks/mix-audio' -or
              $tracksUiScript -notmatch '/v1/tracks/set-zip' -or
              $tracksUiScript -notmatch 'loadComposeFile' -or
              $tracksUiScript -notmatch 'playComposePreview' -or
              $tracksUiScript -notmatch 'pauseComposePreview' -or
              $tracksUiScript -notmatch 'stopComposePreview' -or
              $tracksUiScript -notmatch 'refreshTrackViewFromCompose' -or
              $tracksUiScript -notmatch 'syncTrackViewFromComposeAnalysis' -or
              $tracksUiScript -notmatch 'track-name-input' -or
              $tracksUiScript -notmatch 'track-bars-input' -or
              $tracksUiScript -notmatch 'className = "track-delete"' -or
              $tracksUiScript -notmatch 'deleteTrackFromCompose' -or
              $tracksUiScript -match 'editTracksWorkspaceTrackInCompose' -or
              $tracksUiScript -match 'loadTracksWorkspaceFile' -or
              $tracksUiScript -match 'applyComposeVoice' -or
              $tracksUiScript -notmatch 'addTrackToTracksWorkspace' -or
              $tracksUiScript -notmatch 'updateTracksWorkspaceSource' -or
              $tracksUiScript -notmatch 'setAdvancedTrackVolume'
            ) {
              throw "Portable unified Compose Tracks workflow smoke test failed."
            }

            foreach ($stem in @($stem0, $stem1)) {
              $stemBytes = [System.IO.File]::ReadAllBytes($stem)
              if ($stemBytes.Length -le 44 -or [System.Text.Encoding]::ASCII.GetString($stemBytes, 0, 4) -ne "RIFF") {
                throw "Portable Tracks stem is not a valid WAV."
              }
            }

            if ((Get-FileHash $stem0).Hash -eq (Get-FileHash $stem1).Hash) {
              throw "Portable Tracks stems should not be byte-identical."
            }

            $tracksStemBody = [pscustomobject]@{
              markdown = [string]$composeMarkdown
              fileName = "CI Tracks.md"
              track = 0
            } | ConvertTo-Json -Compress
            $tracksIndependentStem = Join-Path $env:RUNNER_TEMP "notescript-current-track-0.wav"
            Invoke-WebRequest -UseBasicParsing -Method Post -ContentType "application/json" -Body $tracksStemBody -Uri "$baseUri/v1/tracks/track-audio" -OutFile $tracksIndependentStem -TimeoutSec 15
            $tracksIndependentStemBytes = [System.IO.File]::ReadAllBytes($tracksIndependentStem)
            if (
              $tracksIndependentStemBytes.Length -le 44 -or
              [System.Text.Encoding]::ASCII.GetString($tracksIndependentStemBytes, 0, 4) -ne "RIFF"
            ) {
              throw "Portable Compose Tracks stem export is not a valid WAV."
            }

            $tracksBody = [pscustomobject]@{
              markdown = [string]$composeMarkdown
              fileName = "CI Tracks.md"
              mutedTracks = @(1)
            } | ConvertTo-Json -Compress

            $tracksMix = Join-Path $env:RUNNER_TEMP "notescript-tracks-mix.wav"
            Invoke-WebRequest -UseBasicParsing -Method Post -ContentType "application/json" -Body $tracksBody -Uri "$baseUri/v1/tracks/mix-audio" -OutFile $tracksMix -TimeoutSec 15
            $tracksMixBytes = [System.IO.File]::ReadAllBytes($tracksMix)
            if ($tracksMixBytes.Length -le 44 -or [System.Text.Encoding]::ASCII.GetString($tracksMixBytes, 0, 4) -ne "RIFF") {
              throw "Portable Tracks mix export is not a valid WAV."
            }

            $tracksZip = Join-Path $env:RUNNER_TEMP "notescript-track-set.zip"
            Invoke-WebRequest -UseBasicParsing -Method Post -ContentType "application/json" -Body $tracksBody -Uri "$baseUri/v1/tracks/set-zip" -OutFile $tracksZip -TimeoutSec 30
            $zipBytes = [System.IO.File]::ReadAllBytes($tracksZip)
            if ($zipBytes.Length -lt 4 -or [System.Text.Encoding]::ASCII.GetString($zipBytes, 0, 2) -ne "PK") {
              throw "Portable Track Set export is not a ZIP."
            }

            $tracksZipExtract = Join-Path $env:RUNNER_TEMP "notescript-track-set-extracted"
            if (Test-Path $tracksZipExtract) {
              Remove-Item -Recurse -Force $tracksZipExtract
            }
            Expand-Archive -LiteralPath $tracksZip -DestinationPath $tracksZipExtract
            $trackSetRoot = Join-Path $tracksZipExtract "CI Tracks"
            if (
              -not (Test-Path (Join-Path $trackSetRoot "CI Tracks.md")) -or
              -not (Test-Path (Join-Path $trackSetRoot "mix\CI Tracks Mix.wav")) -or
              -not (Test-Path (Join-Path $trackSetRoot "track-set.json")) -or
              @(Get-ChildItem (Join-Path $trackSetRoot "tracks") -Filter "*.wav").Count -ne 2
            ) {
              throw "Portable Track Set ZIP content smoke test failed."
            }
            $trackSetManifest = Get-Content -Raw (Join-Path $trackSetRoot "track-set.json") | ConvertFrom-Json
            if (
              $trackSetManifest.trackCount -ne 2 -or
              @($trackSetManifest.mutedTracks).Count -ne 1 -or
              [int]$trackSetManifest.mutedTracks[0] -ne 1
            ) {
              throw "Portable Track Set manifest smoke test failed."
            }

            & $entry stop
            if ($LASTEXITCODE -ne 0) {
              throw "NoteScript.cmd stop failed."
            }

            Start-Sleep -Milliseconds 300
            try {
              Invoke-RestMethod -Uri "$baseUri/v1/health" -TimeoutSec 1 | Out-Null
              throw "Control API is still reachable after NoteScript.cmd stop."
            } catch {
              if ($_.Exception.Message -eq "Control API is still reachable after NoteScript.cmd stop.") {
                throw
              }
            }

            $statusStoppedAgain = (& $entry status | Out-String)
            if ($LASTEXITCODE -ne 0 -or $statusStoppedAgain -notmatch 'State\s*:\s*STOPPED') {
              throw "NoteScript.cmd status did not return to STOPPED after stop."
            }

            # Idempotent: stopping an already-stopped server remains successful.
            & $entry stop
            if ($LASTEXITCODE -ne 0) {
              throw "NoteScript.cmd stop is not idempotent."
            }
          } finally {
            & $entry stop | Out-Null
          }
